name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install Yandex Browser and Driver
        run: |
          wget -q -O - https://repo.yandex.ru/yandex-browser/YANDEX-BROWSER-KEY.GPG | sudo apt-key add -
          echo "deb [arch=amd64] https://repo.yandex.ru/yandex-browser/deb stable main" | sudo tee /etc/apt/sources.list.d/yandex-browser.list

          sudo apt-get update
          sudo apt-get install -y yandex-browser-stable

          wget https://github.com/yandex/YandexDriver/releases/download/26.6.1.1005/yandexdriver-linux
          chmod +x yandexdriver-linux
          sudo mv yandexdriver-linux /usr/local/bin/yandexdriver

      - name: Find Yandex Browser
        if: always()
        run: |
          echo "Searching for Yandex Browser..."
          find /usr -name "*yandex*" -type f 2>/dev/null | grep -E "browser|yandex-browser" | head -10
          echo "---"
          which yandex-browser || which browser || echo "Not found in PATH"

      - name: Run tests with Maven
        run: mvn clean test -Pci

      - name: Generate Allure Report
        run: |
          mvn allure:report
        continue-on-error: true

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: target/allure-results

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: target/site/allure-maven-plugin